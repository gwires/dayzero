// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP's own default build-tools version (currently 35.0.0) doesn't track
// compileSdk, and modules pulled in from node_modules (@capacitor/android,
// cordova plugins) don't set buildToolsVersion themselves. Left alone, AGP
// tries to auto-install that default into the Nix-provided SDK, which is a
// read-only store path. Force every module onto the version we actually have.
subprojects {
    afterEvaluate { proj ->
        if (proj.hasProperty('android')) {
            proj.android.buildToolsVersion = rootProject.ext.buildToolsVersion
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
